<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Text Vault</title>
</head>

<body bgcolor="#0c223b">

    <br><br><br>

    <center>
        <table bgcolor="#f7f5f3" cellpadding="20" width="370">
            <tr>
                <td align="center">

                    <h1>Personal Text Vault</h1>

                    <p>Your personal information is secure here.</p>

                    <br>

                    <table bgcolor="#17446b" cellpadding="20">
                        <tr>
                            <td align="center">
                                <font color="white" size="7">🔒</font>
                            </td>
                        </tr>
                    </table>

                    <br>

                    <form id="loginForm">

                        <div align="left">
                            <b>Enter Password:</b>
                        </div>

                        <br>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            size="40"
                            required
                        >

                        <br><br>

                        <input type="submit" value="Unlock Vault">

                        <p id="message"></p>

                    </form>

                    <br>

                    <a href="#" onclick="alert('Password recovery is not configured.'); return false;">
                        Forgot Password?
                    </a>

                    <br><br>

                    <font color="gray" size="2">
                        Your privacy matters. Keep your information safe.
                    </font>

                </td>
            </tr>
        </table>
    </center>

    <script src="index.js"></script>

</body>
</html>
